<!DOCTYPE html>
<html lang="hy">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #e8dfd2;
    font-family: "Sylfaen", "Noto Serif Armenian", Georgia, serif;
    color: #2b2119;
}


/* =============================
   WHOLE INVITATION
============================= */

.page {
    width: 100%;
    max-width: 768px;

    margin: 0 auto;

    background: #eee5d6;

    position: relative;

    overflow: hidden;

    box-shadow: 0 18px 50px rgba(0,0,0,.17);
}


/* =============================
   PHOTO AREA
============================= */

.photo-area {
    position: relative;

    width: 100%;
    height: 520px;

    overflow: hidden;

    background: #d9c4a5;
}


/* BIG 70 */

.big-70 {
    position: absolute;

    top: -40px;
    left: 50%;

    transform: translateX(-50%);

    font-family: Georgia, serif;

    font-size: 350px;
    line-height: 1;

    color: rgba(255,255,255,.25);

    z-index: 1;

    pointer-events: none;
}


/* NEW PHOTO */

.person-photo {
    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center 35%;

    display: block;

    position: relative;

    z-index: 2;
}


/* soft beige blend at bottom */

.photo-area::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 90px;

    background:
        linear-gradient(
            to bottom,
            rgba(238,229,214,0),
            #eee5d6
        );

    z-index: 3;
}


/* =============================
   TEXT AREA
============================= */

.content {
    position: relative;

    background: #eee5d6;

    padding:
        22px
        55px
        35px;

    text-align: center;
}


/* torn-looking top edge */

.content::before {
    content: "";

    position: absolute;

    top: -22px;
    left: 0;

    width: 100%;
    height: 28px;

    background: #eee5d6;

    clip-path: polygon(
        0 48%,
        4% 20%,
        8% 48%,
        13% 18%,
        18% 48%,
        23% 23%,
        29% 50%,
        35% 17%,
        41% 45%,
        47% 18%,
        53% 48%,
        59% 21%,
        65% 47%,
        71% 17%,
        77% 48%,
        83% 22%,
        89% 47%,
        94% 18%,
        100% 45%,
        100% 100%,
        0 100%
    );

    z-index: 5;
}


/* =============================
   TITLE
============================= */

.title {
    font-size: 45px;

    font-weight: 400;

    margin-bottom: 23px;
}


/* =============================
   MESSAGE
============================= */

.message {
    font-size: 22px;

    line-height: 1.5;

    margin-bottom: 30px;
}


/* =============================
   DATE
============================= */

.date-row {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    gap: 25px;

    margin:
        10px
        auto
        27px;
}


/* left / right */

.date-side {
    font-size: 19px;

    display: flex;

    flex-direction: column;

    gap: 10px;

    align-items: center;
}

.horizontal-line {
    width: 100%;
    height: 1px;

    background: #746353;
}


/* center */

.date-center {
    display: flex;

    align-items: center;
}

.vertical-line {
    width: 1px;
    height: 95px;

    background: #746353;

    margin: 0 18px;
}

.date-number {
    font-family: Georgia, serif;

    font-size: 68px;

    line-height: .9;
}

.month {
    font-size: 19px;

    margin-top: 8px;
}

.year {
    font-size: 17px;

    margin-top: 4px;
}


/* =============================
   LOCATION
============================= */

.venue {
    font-size: 21px;

    margin-top: 8px;
}

.address {
    font-size: 18px;

    margin-top: 10px;
}


/* =============================
   SIGNATURE
============================= */

.signature {
    font-size: 32px;

    margin-top: 26px;
}


/* =============================
   MUSIC
============================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid #634c38;

    background: rgba(238,229,214,.92);

    color: #4a3525;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 21px;

    cursor: pointer;

    z-index: 30;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);
}


/* =============================
   MOBILE
============================= */

@media (max-width: 768px) {

    body {
        background: #eee5d6;
    }

    .page {
        width: 100%;

        max-width: none;

        margin: 0;

        box-shadow: none;
    }

    .photo-area {
        height: 56vw;

        min-height: 300px;

        max-height: 470px;
    }

    .person-photo {
        object-position: center 30%;
    }

    .big-70 {
        font-size: 48vw;

        top: -5vw;
    }

    .content {
        padding:
            16px
            25px
            28px;
    }

    .title {
        font-size: clamp(27px, 7vw, 42px);

        margin-bottom: 16px;
    }

    .message {
        font-size: clamp(14px, 3.5vw, 21px);

        line-height: 1.5;

        margin-bottom: 19px;
    }

    .date-row {
        gap: 10px;

        margin-bottom: 20px;
    }

    .date-side {
        font-size: clamp(12px, 3vw, 18px);

        gap: 6px;
    }

    .vertical-line {
        height: 65px;

        margin: 0 8px;
    }

    .date-number {
        font-size: clamp(44px, 11vw, 65px);
    }

    .month {
        font-size: clamp(12px, 3vw, 18px);

        margin-top: 5px;
    }

    .year {
        font-size: clamp(11px, 2.8vw, 16px);
    }

    .venue {
        font-size: clamp(14px, 3.5vw, 20px);
    }

    .address {
        font-size: clamp(12px, 3vw, 18px);
    }

    .signature {
        font-size: clamp(22px, 5.5vw, 31px);

        margin-top: 20px;
    }

    .music-button {
        position: fixed;

        right: 14px;
        bottom: 14px;

        width: 44px;
        height: 44px;
    }

}

</style>
</head>


<body>


<div class="page">


    <!-- PHOTO -->

    <div class="photo-area">

        <div class="big-70">
            70
        </div>

        <img
            class="person-photo"
            src="./qisho.png"
            alt=""
        >

    </div>


    <!-- INVITATION -->

    <div class="content">


        <div class="title">

            Սիրելի բարեկամ,

        </div>


        <div class="message">

            Սիրով հրավիրում եմ Ձեզ մասնակցելու<br>

            իմ 70ամյա հոբելյանի ուրախ երեկոյին։

        </div>


        <!-- DATE -->

        <div class="date-row">


            <div class="date-side">

                <div class="horizontal-line"></div>

                <div>
                    Երկուշաբթի
                </div>

                <div class="horizontal-line"></div>

            </div>


            <div class="date-center">


                <div class="vertical-line"></div>


                <div>

                    <div class="date-number">
                        5
                    </div>

                    <div class="month">
                        Հոկտեմբեր
                    </div>

                    <div class="year">
                        2026
                    </div>

                </div>


                <div class="vertical-line"></div>


            </div>


            <div class="date-side">

                <div class="horizontal-line"></div>

                <div>
                    18։00
                </div>

                <div class="horizontal-line"></div>

            </div>


        </div>


        <!-- VENUE -->

        <div class="venue">

            «Մկրտչյանս Հոլլ» Սրահում

        </div>


        <!-- ADDRESS -->

        <div class="address">

            Ք․ Մասիս, Էջմիածնի խճուղի 2/10

        </div>


        <!-- SIGNATURE -->

        <div class="signature">

            Սիրով Ձեր՝ Քիշո

        </div>


    </div>


    <!-- MUSIC BUTTON -->

    <button
        class="music-button"
        id="musicButton"
        aria-label="Play music"
    >
        ♪
    </button>


</div>


<!-- MUSIC -->

<audio
    id="bgMusic"
    autoplay
    loop
    preload="auto"
>

    <source
        src="./music.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

const music =
    document.getElementById("bgMusic");

const musicButton =
    document.getElementById("musicButton");

music.volume = 0.7;


/* TRY AUTOPLAY */

function tryAutoplay() {

    music.play()

        .then(function () {

            musicButton.innerHTML = "❚❚";

        })

        .catch(function () {

            musicButton.innerHTML = "♪";

        });

}


window.addEventListener(
    "load",
    tryAutoplay
);


/* MUSIC BUTTON */

musicButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        if (music.paused) {

            music.play();

            musicButton.innerHTML = "❚❚";

        }

        else {

            music.pause();

            musicButton.innerHTML = "♪";

        }

    }
);

</script>


</body>

</html>
