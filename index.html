<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #e9e1d6;
    overflow-x: hidden;

    font-family:
        "Sylfaen",
        "Noto Serif Armenian",
        "DejaVu Serif",
        Georgia,
        serif;
}


/* =========================
   STAGE
========================= */

.stage {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    overflow: hidden;

    padding: 24px;
}


/* =========================
   ENVELOPE WRAPPER
========================= */

.envelope-scene {
    position: relative;

    width: min(88vw, 720px);
    height: min(78vh, 720px);

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 1400px;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: absolute;

    width: 78%;
    aspect-ratio: 1.48 / 1;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);

    z-index: 2;
}


/* ENVELOPE BACK */

.envelope-back {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            145deg,
            #c69a67,
            #a97849
        );

    border-radius: 4px;

    box-shadow:
        0 22px 50px rgba(0,0,0,.20);

    z-index: 1;
}


/* LEFT SIDE */

.envelope-left {
    position: absolute;

    inset: 0;

    background: #bd8c59;

    clip-path:
        polygon(
            0 0,
            52% 52%,
            0 100%
        );

    z-index: 4;
}


/* RIGHT SIDE */

.envelope-right {
    position: absolute;

    inset: 0;

    background: #b98250;

    clip-path:
        polygon(
            100% 0,
            48% 52%,
            100% 100%
        );

    z-index: 4;
}


/* LOWER FRONT */

.envelope-bottom {
    position: absolute;

    inset: 0;

    background: #cc9d69;

    clip-path:
        polygon(
            0 100%,
            50% 44%,
            100% 100%
        );

    z-index: 5;
}


/* FLAP */

.envelope-flap {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 58%;

    background:
        linear-gradient(
            160deg,
            #c99a66,
            #ac7949
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin: top center;

    z-index: 7;

    animation:
        openFlap 0.9s ease forwards;

    animation-delay: .45s;
}


/* =========================
   CARD
========================= */

.card {
    position: absolute;

    left: 50%;
    bottom: 10%;

    width: min(78%, 620px);

    transform:
        translateX(-50%)
        translateY(30%)
        scale(.72);

    opacity: 0;

    z-index: 3;

    animation:
        cardRise 2.25s cubic-bezier(.22,.78,.20,1) forwards;

    animation-delay: 1.15s;
}


.card-front {
    position: relative;

    width: 100%;

    background: #eee5d6;

    box-shadow:
        0 18px 50px rgba(0,0,0,.18);
}


.invitation-bg {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================
   TEXT OVERLAY
========================= */

.invitation-text {
    position: absolute;

    left: 10%;
    right: 10%;

    top: 55%;
    bottom: 5%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    color: #2b2017;

    z-index: 10;
}


/* TITLE */

.invitation-title {
    font-size:
        clamp(24px, 4.4vw, 43px);

    font-weight: 400;

    margin-bottom: 4%;
}


/* MESSAGE */

.invitation-message {
    width: 95%;

    font-size:
        clamp(13px, 2.2vw, 21px);

    line-height: 1.45;

    margin-bottom: 4%;
}


/* =========================
   DATE
========================= */

.date-row {
    width: 100%;

    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    gap: 4%;

    margin-top: 2%;
}


.date-side {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 8px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.horizontal-line {
    width: 100%;
    height: 1px;

    background:
        rgba(55,42,30,.55);
}


.date-center {
    display: flex;
    align-items: center;
}


.vertical-line {
    width: 1px;
    height: 80px;

    background:
        rgba(55,42,30,.55);

    margin: 0 13px;
}


.day-number {
    font-family: Georgia, serif;

    font-size:
        clamp(45px, 7vw, 68px);

    line-height: .9;
}


.month {
    margin-top: 7px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.year {
    margin-top: 3px;

    font-size:
        clamp(11px, 1.8vw, 16px);
}


/* =========================
   VENUE / ADDRESS / SIGNATURE
========================= */

.venue {
    margin-top: 4%;

    font-size:
        clamp(13px, 2.2vw, 20px);
}


.address {
    margin-top: 1.2%;

    font-size:
        clamp(11px, 1.9vw, 17px);

    white-space: nowrap;
}


.signature {
    margin-top: auto;

    font-size:
        clamp(20px, 3.5vw, 33px);

    padding-bottom: 1%;
}


/* =========================
   MUSIC
========================= */

.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(75,54,36,.5);

    background:
        rgba(239,226,204,.94);

    color: #493729;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    z-index: 100;
}


/* =========================
   ANIMATION
========================= */

@keyframes openFlap {

    0% {
        transform: rotateX(0deg);
    }

    100% {
        transform: rotateX(180deg);
        z-index: 0;
    }

}


@keyframes cardRise {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(30%)
            scale(.72);

        z-index: 3;
    }

    18% {
        opacity: 1;
    }

    55% {
        transform:
            translateX(-50%)
            translateY(-55%)
            scale(.84);

        z-index: 3;
    }

    56% {
        z-index: 20;
    }

    100% {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(-20%)
            scale(1.03);

        z-index: 20;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .stage {
        min-height: 100vh;
        padding: 0;
    }


    .envelope-scene {
        width: 100vw;
        height: 100vh;
    }


    .envelope {
        width: 82%;
        bottom: 9%;
    }


    .card {
        width: 82%;
        bottom: 8%;
    }


    .invitation-text {
        left: 9%;
        right: 9%;

        top: 55%;
        bottom: 4%;
    }


    .vertical-line {
        height: 54px;
        margin: 0 7px;
    }


    .date-side {
        gap: 5px;
    }


    .music-button {
        right: 14px;
        bottom: 14px;

        width: 44px;
        height: 44px;

        font-size: 19px;
    }

}


/* SMALL PHONES */

@media (max-width: 420px) {

    .card {
        width: 88%;
    }

    .envelope {
        width: 88%;
    }

    .invitation-title {
        font-size: 21px;
    }

    .invitation-message {
        font-size: 10.5px;
    }

    .date-side {
        font-size: 9.5px;
    }

    .day-number {
        font-size: 39px;
    }

    .month {
        font-size: 9.5px;
    }

    .year {
        font-size: 9px;
    }

    .venue {
        font-size: 10.5px;
    }

    .address {
        font-size: 9px;
    }

    .signature {
        font-size: 18px;
    }

}

</style>
</head>


<body>


<div class="stage">


    <div class="envelope-scene">


        <!-- ENVELOPE -->

        <div class="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-left"></div>

            <div class="envelope-right"></div>

            <div class="envelope-bottom"></div>

            <div class="envelope-flap"></div>

        </div>


        <!-- CARD -->

        <div class="card">

            <div class="card-front">


                <img
                    class="invitation-bg"
                    src="./invitation-bg.png"
                    alt="70th Birthday Invitation"
                >


                <!-- YOUR ARMENIAN HTML TEXT -->

                <div class="invitation-text">


                    <div class="invitation-title">
                        Սիրելի բարեկամ,
                    </div>


                    <div class="invitation-message">

                        Սիրով հրավիրում եմ Ձեզ մասնակցելու<br>

                        իմ 70ամյա հոբելյանի ուրախ երեկոյին։

                    </div>


                    <div class="date-row">


                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>
                                Երկուշաբթի
                            </div>

                            <div class="horizontal-line"></div>

                        </div>


                        <div class="date-center">

                            <div class="vertical-line"></div>


                            <div>

                                <div class="day-number">
                                    5
                                </div>

                                <div class="month">
                                    Հոկտեմբեր
                                </div>

                                <div class="year">
                                    2026
                                </div>

                            </div>


                            <div class="vertical-line"></div>

                        </div>


                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>
                                18։00
                            </div>

                            <div class="horizontal-line"></div>

                        </div>


                    </div>


                    <div class="venue">
                        «Մկրտչյանս Հոլլ» Սրահում
                    </div>


                    <div class="address">
                        Ք․ Մասիս, Էջմիածնի խճուղի 2/10
                    </div>


                    <div class="signature">
                        Սիրով Ձեր՝ Քիշո
                    </div>


                </div>


            </div>

        </div>


    </div>


</div>


<audio
    id="bgMusic"
    autoplay
    loop
    preload="auto"
>
    <source
        src="./music.mp3"
        type="audio/mpeg"
    >
</audio>


<button
    class="music-button"
    id="musicButton"
    aria-label="Play or pause music"
>
    ♪
</button>


<script>

const music =
    document.getElementById("bgMusic");

const musicButton =
    document.getElementById("musicButton");

music.volume = 0.7;


function tryAutoplay() {

    const attempt = music.play();

    if (attempt !== undefined) {

        attempt
            .then(function () {

                musicButton.innerHTML = "❚❚";

            })
            .catch(function () {

                musicButton.innerHTML = "♪";

            });

    }

}


document.addEventListener(
    "DOMContentLoaded",
    tryAutoplay
);


window.addEventListener(
    "load",
    tryAutoplay
);


musicButton.addEventListener(
    "click",
    function () {

        if (music.paused) {

            music.play();

            musicButton.innerHTML = "❚❚";

        }

        else {

            music.pause();

            musicButton.innerHTML = "♪";

        }

    }
);

</script>


</body>

</html>
