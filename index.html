<!DOCTYPE html>
<html lang="hy">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at center,
            #f3eadf 0%,
            #ece2d6 55%,
            #e7ddd0 100%
        );

    font-family:
        "Sylfaen",
        "Noto Serif Armenian",
        "DejaVu Serif",
        Georgia,
        serif;

    color: #2b2119;

    overflow-x: hidden;
}


/* ========================================
   BACKGROUND DECORATIONS
======================================== */

.decor {
    position: fixed;

    top: 0;
    bottom: 0;

    width: 180px;

    z-index: 0;

    pointer-events: none;
}


.decor-left {
    left: 0;
}


.decor-right {
    right: 0;

    transform: scaleX(-1);
}


/* BRANCH STEM */

.branch {
    position: absolute;

    width: 3px;

    background:
        linear-gradient(
            to bottom,
            #886f45,
            #6d5a3a
        );

    border-radius: 50%;

    transform-origin: bottom center;
}


/* LEAVES */

.leaf {
    position: absolute;

    width: 24px;
    height: 9px;

    background:
        linear-gradient(
            135deg,
            #6f7354,
            #3f4936
        );

    border-radius:
        100% 0 100% 0;

    transform-origin: left center;

    opacity: .94;
}


/* GOLDEN SPRIG */

.sprig {
    position: absolute;

    width: 2px;

    background: #a67c3d;

    transform-origin: bottom center;
}


.sprig::before,
.sprig::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 3px;

    background: #b68a47;

    border-radius: 50%;

    box-shadow:
        0 12px 0 #b68a47,
        0 24px 0 #b68a47,
        0 36px 0 #b68a47,
        0 48px 0 #b68a47,
        0 60px 0 #b68a47;
}


.sprig::before {

    left: -6px;

    transform: rotate(-28deg);
}


.sprig::after {

    right: -6px;

    transform: rotate(28deg);
}


/* LEFT DECORATION POSITIONS */

.decor-left .b1 {

    left: 24px;
    top: 50px;

    height: 280px;

    transform: rotate(-8deg);
}


.decor-left .b2 {

    left: 65px;
    top: 520px;

    height: 250px;

    transform: rotate(7deg);
}


.decor-left .b3 {

    left: 28px;
    bottom: 60px;

    height: 270px;

    transform: rotate(-5deg);
}


.decor-left .s1 {

    left: 88px;
    top: 22px;

    height: 155px;

    transform: rotate(18deg);
}


.decor-left .s2 {

    left: 105px;
    top: 455px;

    height: 150px;

    transform: rotate(12deg);
}


.decor-left .s3 {

    left: 90px;
    bottom: 30px;

    height: 165px;

    transform: rotate(15deg);
}


/* LEAF POSITIONS */

.l1 {
    left: 2px;
    top: 48px;
    transform: rotate(-35deg);
}

.l2 {
    left: 5px;
    top: 86px;
    transform: rotate(-22deg);
}

.l3 {
    left: 10px;
    top: 128px;
    transform: rotate(-10deg);
}

.l4 {
    left: 14px;
    top: 170px;
    transform: rotate(5deg);
}

.l5 {
    left: 18px;
    top: 212px;
    transform: rotate(20deg);
}


.l6 {
    left: 70px;
    top: 540px;
    transform: rotate(145deg);
}

.l7 {
    left: 70px;
    top: 582px;
    transform: rotate(160deg);
}

.l8 {
    left: 68px;
    top: 625px;
    transform: rotate(175deg);
}

.l9 {
    left: 64px;
    top: 668px;
    transform: rotate(190deg);
}


.l10 {
    left: 6px;
    bottom: 230px;
    transform: rotate(-28deg);
}

.l11 {
    left: 10px;
    bottom: 185px;
    transform: rotate(-12deg);
}

.l12 {
    left: 13px;
    bottom: 140px;
    transform: rotate(4deg);
}

.l13 {
    left: 16px;
    bottom: 95px;
    transform: rotate(20deg);

/* GOLD SPECKLES */

.speckles {

    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background-image:
        radial-gradient(
            circle,
            rgba(184,139,69,.55) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(184,139,69,.35) 1px,
            transparent 1.5px
        );

    background-size:
        90px 110px,
        140px 160px;

    background-position:
        15px 35px,
        55px 95px;

    opacity: .34;
}


/* ========================================
   STAGE
======================================== */

.stage {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    padding: 30px 20px 80px;

    overflow: visible;

    z-index: 2;
}


/* ========================================
   SCENE
======================================== */

.scene {

    position: relative;

    width: min(92vw, 760px);

    min-height: 900px;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1600px;

    overflow: visible;
}


/* ========================================
   ENVELOPE
======================================== */

.envelope {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 76%;

    aspect-ratio: 1.5 / 1;

    transform:
        translate(-50%, -10%);

    z-index: 2;
}


/* ENVELOPE BACK */

.envelope-back {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            145deg,
            #c69b69,
            #aa7a4c
        );

    box-shadow:
        0 22px 50px rgba(0,0,0,.20);

    z-index: 1;
}


/* LEFT FOLD */

.envelope-left {

    position: absolute;

    inset: 0;

    background: #bd8d5a;

    clip-path:
        polygon(
            0 0,
            52% 52%,
            0 100%
        );

    z-index: 4;
}


/* RIGHT FOLD */

.envelope-right {

    position: absolute;

    inset: 0;

    background: #b98250;

    clip-path:
        polygon(
            100% 0,
            48% 52%,
            100% 100%
        );

    z-index: 4;
}


/* BOTTOM FOLD */

.envelope-bottom {

    position: absolute;

    inset: 0;

    background: #cc9d69;

    clip-path:
        polygon(
            0 100%,
            50% 44%,
            100% 100%
        );

    z-index: 5;
}


/* ENVELOPE FLAP */

.envelope-flap {

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    height: 58%;

    background:
        linear-gradient(
            160deg,
            #cb9c69,
            #ad7a4a
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin: top center;

    z-index: 7;

    animation:
        openFlap 1.8s ease forwards;

    animation-delay: 1s;
}


/* ========================================
   INVITATION CARD
======================================== */

.card {

    position: absolute;

    left: 50%;

    top: 50%;

    width: min(78%, 640px);

    opacity: 0;

    transform:
        translate(-50%, 10%)
        scale(.70);

    z-index: 3;

    animation:
        cardRise 3.8s
        cubic-bezier(.22,.78,.20,1)
        forwards;

    animation-delay: 2.4s;
}


.card-front {

    position: relative;

    width: 100%;

    box-shadow:
        0 20px 55px rgba(0,0,0,.20);
}


.invitation-bg {

    display: block;

    width: 100%;

    height: auto;
}


/* ========================================
   INVITATION TEXT
======================================== */

.invitation-text {

    position: absolute;

    left: 10%;

    right: 10%;

    /*
       MOVED UP SLIGHTLY
       TO KEEP SIGNATURE INSIDE CARD
    */

    top: 54%;

    bottom: 8%;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    color: #2b2017;

    z-index: 10;
}


/* TITLE */

.invitation-title {

    font-size:
        clamp(24px, 4.4vw, 43px);

    font-weight: 400;

    margin-bottom: 3%;
}


/* MESSAGE */

.invitation-message {

    width: 95%;

    font-size:
        clamp(13px, 2.2vw, 21px);

    line-height: 1.4;

    margin-bottom: 3%;
}


/* ========================================
   DATE
======================================== */

.date-row {

    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    gap: 4%;

    margin-top: 1%;
}


.date-side {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.horizontal-line {

    width: 100%;

    height: 1px;

    background:
        rgba(55,42,30,.55);
}


.date-center {

    display: flex;

    align-items: center;
}


.vertical-line {

    width: 1px;

    height: 76px;

    background:
        rgba(55,42,30,.55);

    margin: 0 13px;
}


.day-number {

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(45px, 7vw, 68px);

    line-height: .9;
}


.month {

    margin-top: 6px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.year {

    margin-top: 2px;

    font-size:
        clamp(11px, 1.8vw, 16px);
}


/* ========================================
   VENUE
======================================== */

.venue {

    margin-top: 3%;

    font-size:
        clamp(13px, 2.2vw, 20px);
}


/* ========================================
   ADDRESS
======================================== */

.address {

    margin-top: .8%;

    font-size:
        clamp(11px, 1.9vw, 17px);

    white-space: nowrap;
}


/* ========================================
   SIGNATURE
======================================== */

.signature {

    margin-top: 10px;

    font-size:
        clamp(18px, 3.2vw, 30px);

    line-height: 1.1;

    padding-bottom: 0;
}


/* ========================================
   MUSIC BUTTON
======================================== */

.music-button {

    position: fixed;

    right: 18px;

    bottom: 18px;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(75,54,36,.5);

    background:
        rgba(239,226,204,.94);

    color: #493729;

    font-size: 21px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    z-index: 100;
}


/* ========================================
   ANIMATIONS
======================================== */

@keyframes openFlap {

    0% {

        transform:
            rotateX(0deg);
    }


    100% {

        transform:
            rotateX(180deg);

        z-index: 0;
    }

}


/* CARD COMES OUT OF ENVELOPE */

@keyframes cardRise {

    0% {

        opacity: 0;

        transform:
            translate(-50%, 10%)
            scale(.70);

        z-index: 3;
    }


    12% {

        opacity: 1;
    }


    48% {

        transform:
            translate(-50%, -38%)
            scale(.82);

        z-index: 3;
    }


    /*
       CARD MOVES IN FRONT
       OF ENVELOPE HERE
    */

    49% {

        z-index: 20;
    }


    70% {

        transform:
            translate(-50%, -22%)
            scale(.92);

        z-index: 20;
    }


    /*
       FINAL POSITION
    */

    100% {

        opacity: 1;

        transform:
            translate(-50%, -15%)
            scale(1);

        z-index: 20;
    }

}


/* ========================================
   TABLET / MOBILE
======================================== */

@media (max-width: 768px) {

    body {

        overflow-y: auto;
    }


    .decor {

        width: 95px;

        opacity: .72;
    }


    .stage {

        min-height: 100vh;

        padding:
            20px
            0
            80px;

        align-items: flex-start;
    }


    .scene {

        width: 100%;

        min-height: 760px;
    }


    .envelope {

        width: 86%;

        top: 310px;
    }


    .card {

        width: 88%;

        top: 310px;
    }


    /*
       MOBILE TEXT
       MOVED UP AS WELL
    */

    .invitation-text {

        left: 9%;

        right: 9%;

        top: 53.5%;

        bottom: 8%;
    }


    .invitation-title {

        margin-bottom: 2.5%;
    }


    .invitation-message {

        margin-bottom: 2.5%;

        line-height: 1.35;
    }


    .date-row {

        margin-top: 0;
    }


    .vertical-line {

        height: 54px;

        margin: 0 7px;
    }


    .date-side {

        gap: 5px;
    }


    .venue {

        margin-top: 2.5%;
    }


    .address {

        margin-top: .5%;
    }


    .signature {

        margin-top: 7px;

        padding-bottom: 0;
    }


    .music-button {

        right: 14px;

        bottom: 14px;

        width: 44px;

        height: 44px;

        font-size: 19px;
    }

}


/* ========================================
   SMALL PHONES
======================================== */

@media (max-width: 420px) {

    .decor {

        width: 70px;

        opacity: .55;
    }


    .scene {

        min-height: 700px;
    }

    }

        width: 91%;

    }

        line-height: 1;
    }

}

</style>

</head>

    >

    class="music-button"
    id="musicButton"
    aria-label="Play or pause music"
>

    ♪

</button>



<script>

const music =
    document.getElementById("bgMusic");


const musicButton =
    document.getElementById("musicButton");


music.volume = 0.7;



/* ========================================
   TRY AUTOPLAY IMMEDIATELY
======================================== */

function tryAutoplay() {

    const attempt =
        music.play();


    if (attempt !== undefined) {


        attempt

            .then(function () {


                musicButton.innerHTML =
                    "❚❚";


            })


            .catch(function () {


                musicButton.innerHTML =
                    "♪";


            });

    }

}



document.addEventListener(
    "DOMContentLoaded",
    tryAutoplay
);



window.addEventListener(
    "load",
    tryAutoplay
);



/* ========================================
   MUSIC PLAY / PAUSE BUTTON
======================================== */

musicButton.addEventListener(
    "click",
    function () {


        if (music.paused) {


            music.play();


            musicButton.innerHTML =
                "❚❚";


        }


        else {


            music.pause();


            musicButton.innerHTML =
                "♪";


        }


    }
);

</script>
