<!DOCTYPE html>
<html lang="hy">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #e9e1d6;
    overflow-x: hidden;

    font-family:
        "Sylfaen",
        "Noto Serif Armenian",
        "DejaVu Serif",
        Georgia,
        serif;

    color: #2b2119;
}


/* =========================
   STAGE
========================= */

.stage {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;

    padding: 24px;
}


/* =========================
   SCENE
========================= */

.scene {
    position: relative;

    width: min(92vw, 760px);
    height: min(92vh, 900px);

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 1600px;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: absolute;

    left: 50%;
    bottom: 8%;

    width: 76%;
    aspect-ratio: 1.5 / 1;

    transform: translateX(-50%);

    z-index: 2;
}


/* BACK */

.envelope-back {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            145deg,
            #c69b69,
            #aa7a4c
        );

    border-radius: 4px;

    box-shadow:
        0 22px 50px rgba(0,0,0,.20);

    z-index: 1;
}


/* LEFT FOLD */

.envelope-left {
    position: absolute;
    inset: 0;

    background: #bd8d5a;

    clip-path:
        polygon(
            0 0,
            52% 52%,
            0 100%
        );

    z-index: 4;
}


/* RIGHT FOLD */

.envelope-right {
    position: absolute;
    inset: 0;

    background: #b98250;

    clip-path:
        polygon(
            100% 0,
            48% 52%,
            100% 100%
        );

    z-index: 4;
}


/* BOTTOM FOLD */

.envelope-bottom {
    position: absolute;
    inset: 0;

    background: #cc9d69;

    clip-path:
        polygon(
            0 100%,
            50% 44%,
            100% 100%
        );

    z-index: 5;
}


/* FLAP */

.envelope-flap {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 58%;

    background:
        linear-gradient(
            160deg,
            #cb9c69,
            #ad7a4a
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin: top center;

    z-index: 7;

    animation: openFlap 1.8s ease forwards;
    animation-delay: 1s;
}


/* =========================
   INVITATION CARD
========================= */

.card {
    position: absolute;

    left: 50%;
    bottom: 7%;

    width: min(78%, 640px);

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(34%)
        scale(.70);

    z-index: 3;

    animation:
        cardRise 3.4s
        cubic-bezier(.22,.78,.20,1)
        forwards;

    animation-delay: 2.4s;
}


.card-front {
    position: relative;
    width: 100%;

    box-shadow:
        0 20px 55px rgba(0,0,0,.18);
}


/* IMPORTANT:
   YOUR NEW IMAGE IS Qish.png
*/

.Qish {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================
   ARMENIAN HTML TEXT
========================= */

.invitation-text {
    position: absolute;

    left: 10%;
    right: 10%;

    top: 55%;
    bottom: 5%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    color: #2b2017;

    z-index: 10;
}


/* TITLE */

.invitation-title {
    font-size:
        clamp(24px, 4.4vw, 43px);

    font-weight: 400;

    margin-bottom: 4%;
}


/* MESSAGE */

.invitation-message {
    width: 95%;

    font-size:
        clamp(13px, 2.2vw, 21px);

    line-height: 1.45;

    margin-bottom: 4%;
}


/* =========================
   DATE
========================= */

.date-row {
    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    gap: 4%;

    margin-top: 2%;
}


.date-side {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 8px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.horizontal-line {
    width: 100%;
    height: 1px;

    background:
        rgba(55,42,30,.55);
}


.date-center {
    display: flex;
    align-items: center;
}


.vertical-line {
    width: 1px;
    height: 80px;

    background:
        rgba(55,42,30,.55);

    margin: 0 13px;
}


.day-number {
    font-family: Georgia, serif;

    font-size:
        clamp(45px, 7vw, 68px);

    line-height: .9;
}


.month {
    margin-top: 7px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.year {
    margin-top: 3px;

    font-size:
        clamp(11px, 1.8vw, 16px);
}


/* =========================
   VENUE
========================= */

.venue {
    margin-top: 4%;

    font-size:
        clamp(13px, 2.2vw, 20px);
}


/* =========================
   ADDRESS
========================= */

.address {
    margin-top: 1.2%;

    font-size:
        clamp(11px, 1.9vw, 17px);

    white-space: nowrap;
}


/* =========================
   SIGNATURE
========================= */

.signature {
    margin-top: auto;

    font-size:
        clamp(20px, 3.5vw, 33px);

    padding-bottom: 1%;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(75,54,36,.5);

    background:
        rgba(239,226,204,.94);

    color: #493729;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    z-index: 100;
}


/* =========================
   ENVELOPE OPENING
========================= */

@keyframes openFlap {

    0% {
        transform: rotateX(0deg);
    }

    100% {
        transform: rotateX(180deg);
        z-index: 0;
    }

}


/* =========================
   CARD COMES OUT
========================= */

@keyframes cardRise {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(34%)
            scale(.70);

        z-index: 3;
    }


    12% {
        opacity: 1;
    }


    /* CARD RISES FROM INSIDE */

    48% {

        transform:
            translateX(-50%)
            translateY(-58%)
            scale(.84);

        z-index: 3;
    }


    /* CARD NOW MOVES IN FRONT */

    49% {
        z-index: 20;
    }


    76% {

        transform:
            translateX(-50%)
            translateY(-35%)
            scale(.96);

        z-index: 20;
    }


    /* FINAL POSITION */

    100% {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(-19%)
            scale(1.02);

        z-index: 20;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .stage {
        min-height: 100vh;
        padding: 0;
    }


    .scene {
        width: 100vw;
        height: 100vh;
    }


    .envelope {
        width: 86%;
        bottom: 8%;
    }


    .card {
        width: 88%;
        bottom: 7%;
    }


    .invitation-text {
        left: 9%;
        right: 9%;

        top: 55%;
        bottom: 4%;
    }


    .vertical-line {
        height: 54px;
        margin: 0 7px;
    }


    .date-side {
        gap: 5px;
    }


    .music-button {
        right: 14px;
        bottom: 14px;

        width: 44px;
        height: 44px;

        font-size: 19px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 420px) {

    .card {
        width: 91%;
    }


    .envelope {
        width: 91%;
    }


    .invitation-title {
        font-size: 21px;
    }


    .invitation-message {
        font-size: 10.5px;
    }


    .date-side {
        font-size: 9.5px;
    }


    .day-number {
        font-size: 39px;
    }


    .month {
        font-size: 9.5px;
    }


    .year {
        font-size: 9px;
    }


    .venue {
        font-size: 10.5px;
    }


    .address {
        font-size: 9px;
    }


    .signature {
        font-size: 18px;
    }

}

</style>

</head>


<body>


<div class="stage">


    <div class="scene">


        <!-- =====================
             ENVELOPE
        ====================== -->

        <div class="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-left"></div>

            <div class="envelope-right"></div>

            <div class="envelope-bottom"></div>

            <div class="envelope-flap"></div>

        </div>



        <!-- =====================
             INVITATION CARD
        ====================== -->

        <div class="card">


            <div class="card-front">


                <!-- NEW IMAGE -->

                <img
                    class="invitation-bg"
                    src="./qisho.png"
                    alt="70th Birthday Invitation"
                >



                <!-- =====================
                     REAL ARMENIAN TEXT
                     NOT PART OF IMAGE
                ====================== -->

                <div class="invitation-text">


                    <div class="invitation-title">

                        Սիրելի բարեկամ,

                    </div>



                    <div class="invitation-message">

                        Սիրով հրավիրում եմ Ձեզ մասնակցելու<br>

                        իմ 70ամյա հոբելյանի ուրախ երեկոյին։

                    </div>



                    <!-- DATE -->

                    <div class="date-row">


                        <!-- MONDAY -->

                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>

                                Երկուշաբթի

                            </div>

                            <div class="horizontal-line"></div>

                        </div>



                        <!-- CENTER DATE -->

                        <div class="date-center">


                            <div class="vertical-line"></div>


                            <div>


                                <div class="day-number">

                                    5

                                </div>


                                <div class="month">

                                    Հոկտեմբեր

                                </div>


                                <div class="year">

                                    2026

                                </div>


                            </div>


                            <div class="vertical-line"></div>


                        </div>



                        <!-- TIME -->

                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>

                                18։00

                            </div>

                            <div class="horizontal-line"></div>

                        </div>


                    </div>



                    <!-- VENUE -->

                    <div class="venue">

                        «Մկրտչյանս Հոլլ» Սրահում

                    </div>



                    <!-- ADDRESS -->

                    <div class="address">

                        Ք․ Մասիս, Էջմիածնի խճուղի 2/10

                    </div>



                    <!-- SIGNATURE -->

                    <div class="signature">

                        Սիրով Ձեր՝ Քիշո

                    </div>


                </div>


            </div>


        </div>


    </div>


</div>



<!-- =====================
     MUSIC
====================== -->

<audio
    id="bgMusic"
    autoplay
    loop
    preload="auto"
>

    <source
        src="./music.mp3"
        type="audio/mpeg"
    >

</audio>



<!-- MUSIC BUTTON -->

<button
    class="music-button"
    id="musicButton"
    aria-label="Play or pause music"
>

    ♪

</button>



<script>

const music =
    document.getElementById("bgMusic");

const musicButton =
    document.getElementById("musicButton");


music.volume = 0.7;



/* =========================
   TRY TO PLAY MUSIC
   AS SOON AS PAGE OPENS
========================= */

function tryAutoplay() {

    const attempt = music.play();


    if (attempt !== undefined) {

        attempt

            .then(function () {

                musicButton.innerHTML = "❚❚";

            })


            .catch(function () {

                /*
                Some phones, especially iPhone,
                block automatic sound.

                In that case the music button
                remains available.
                */

                musicButton.innerHTML = "♪";

            });

    }

}



document.addEventListener(
    "DOMContentLoaded",
    tryAutoplay
);



window.addEventListener(
    "load",
    tryAutoplay
);



/* =========================
   MUSIC BUTTON
========================= */

musicButton.addEventListener(
    "click",
    function () {


        if (music.paused) {

            music.play();

            musicButton.innerHTML = "❚❚";

        }


        else {

            music.pause();

            musicButton.innerHTML = "♪";

        }


    }
);

</script>


</body>

</html>
