<!DOCTYPE html>
<html lang="hy">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #e9e1d6;

    font-family:
        "Sylfaen",
        "Noto Serif Armenian",
        "DejaVu Serif",
        Georgia,
        serif;

    color: #2b2119;

    overflow-x: hidden;
}


/* =========================
   STAGE
========================= */

.stage {
    width: 100%;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    padding: 30px 20px;

    overflow: visible;
}


/* =========================
   SCENE
========================= */

.scene {
    position: relative;

    width: min(92vw, 760px);

    min-height: 900px;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1600px;

    overflow: visible;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 76%;
    aspect-ratio: 1.5 / 1;

    transform:
        translate(-50%, -10%);

    z-index: 2;
}


/* BACK */

.envelope-back {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            145deg,
            #c69b69,
            #aa7a4c
        );

    box-shadow:
        0 22px 50px rgba(0,0,0,.20);

    z-index: 1;
}


/* LEFT */

.envelope-left {
    position: absolute;

    inset: 0;

    background: #bd8d5a;

    clip-path:
        polygon(
            0 0,
            52% 52%,
            0 100%
        );

    z-index: 4;
}


/* RIGHT */

.envelope-right {
    position: absolute;

    inset: 0;

    background: #b98250;

    clip-path:
        polygon(
            100% 0,
            48% 52%,
            100% 100%
        );

    z-index: 4;
}


/* BOTTOM */

.envelope-bottom {
    position: absolute;

    inset: 0;

    background: #cc9d69;

    clip-path:
        polygon(
            0 100%,
            50% 44%,
            100% 100%
        );

    z-index: 5;
}


/* FLAP */

.envelope-flap {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 58%;

    background:
        linear-gradient(
            160deg,
            #cb9c69,
            #ad7a4a
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin: top center;

    z-index: 7;

    animation:
        openFlap 1.8s ease forwards;

    animation-delay: 1s;
}


/* =========================
   CARD
========================= */

.card {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(78%, 640px);

    opacity: 0;

    transform:
        translate(-50%, 5%)
        scale(.70);

    z-index: 3;

    animation:
        cardRise 3.8s
        cubic-bezier(.22,.78,.20,1)
        forwards;

    animation-delay: 2.4s;
}


.card-front {
    position: relative;

    width: 100%;

    box-shadow:
        0 20px 55px rgba(0,0,0,.20);
}


.invitation-bg {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================
   TEXT
========================= */

.invitation-text {
    position: absolute;

    left: 10%;
    right: 10%;

    top: 55%;
    bottom: 5%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    color: #2b2017;

    z-index: 10;
}


/* TITLE */

.invitation-title {
    font-size:
        clamp(24px, 4.4vw, 43px);

    font-weight: 400;

    margin-bottom: 4%;
}


/* MESSAGE */

.invitation-message {
    width: 95%;

    font-size:
        clamp(13px, 2.2vw, 21px);

    line-height: 1.45;

    margin-bottom: 4%;
}


/* =========================
   DATE
========================= */

.date-row {
    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    gap: 4%;

    margin-top: 2%;
}


.date-side {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 8px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.horizontal-line {
    width: 100%;
    height: 1px;

    background:
        rgba(55,42,30,.55);
}


.date-center {
    display: flex;
    align-items: center;
}


.vertical-line {
    width: 1px;
    height: 80px;

    background:
        rgba(55,42,30,.55);

    margin: 0 13px;
}


.day-number {
    font-family: Georgia, serif;

    font-size:
        clamp(45px, 7vw, 68px);

    line-height: .9;
}


.month {
    margin-top: 7px;

    font-size:
        clamp(12px, 2vw, 18px);
}


.year {
    margin-top: 3px;

    font-size:
        clamp(11px, 1.8vw, 16px);
}


/* =========================
   VENUE / ADDRESS
========================= */

.venue {
    margin-top: 4%;

    font-size:
        clamp(13px, 2.2vw, 20px);
}


.address {
    margin-top: 1.2%;

    font-size:
        clamp(11px, 1.9vw, 17px);

    white-space: nowrap;
}


/* =========================
   SIGNATURE
========================= */

.signature {
    margin-top: auto;

    font-size:
        clamp(20px, 3.5vw, 33px);

    padding-bottom: 1%;
}


/* =========================
   MUSIC
========================= */

.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(75,54,36,.5);

    background:
        rgba(239,226,204,.94);

    color: #493729;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    z-index: 100;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes openFlap {

    0% {
        transform: rotateX(0deg);
    }

    100% {
        transform: rotateX(180deg);

        z-index: 0;
    }

}


/* CARD STARTS INSIDE ENVELOPE
   THEN COMES COMPLETELY FORWARD */

@keyframes cardRise {

    0% {
        opacity: 0;

        transform:
            translate(-50%, 10%)
            scale(.70);

        z-index: 3;
    }


    12% {
        opacity: 1;
    }


    48% {
        transform:
            translate(-50%, -38%)
            scale(.82);

        z-index: 3;
    }


    49% {
        z-index: 20;
    }


    70% {
        transform:
            translate(-50%, -22%)
            scale(.92);

        z-index: 20;
    }


    100% {
        opacity: 1;

        transform:
            translate(-50%, -15%)
            scale(1);

        z-index: 20;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    body {
        overflow-y: auto;
    }


    .stage {
        min-height: 100vh;

        padding:
            20px
            0
            80px;

        align-items: flex-start;

        overflow: visible;
    }


    .scene {
        width: 100%;

        min-height: 760px;

        overflow: visible;
    }


    .envelope {
        width: 86%;

        top: 310px;
    }


    .card {
        width: 88%;

        top: 310px;
    }


    .invitation-text {
        left: 9%;
        right: 9%;

        top: 55%;
        bottom: 4%;
    }


    .vertical-line {
        height: 54px;

        margin: 0 7px;
    }


    .date-side {
        gap: 5px;
    }


    .music-button {
        right: 14px;
        bottom: 14px;

        width: 44px;
        height: 44px;

        font-size: 19px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 420px) {

    .scene {
        min-height: 700px;
    }


    .envelope {
        width: 91%;

        top: 270px;
    }


    .card {
        width: 91%;

        top: 270px;
    }


    .invitation-title {
        font-size: 21px;
    }


    .invitation-message {
        font-size: 10.5px;
    }


    .date-side {
        font-size: 9.5px;
    }


    .day-number {
        font-size: 39px;
    }


    .month {
        font-size: 9.5px;
    }


    .year {
        font-size: 9px;
    }


    .venue {
        font-size: 10.5px;
    }


    .address {
        font-size: 9px;
    }


    .signature {
        font-size: 18px;
    }

}

</style>
</head>


<body>


<div class="stage">

    <div class="scene">


        <!-- ENVELOPE -->

        <div class="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-left"></div>

            <div class="envelope-right"></div>

            <div class="envelope-bottom"></div>

            <div class="envelope-flap"></div>

        </div>



        <!-- CARD -->

        <div class="card">

            <div class="card-front">


                <img
                    class="invitation-bg"
                    src="./Qish.png"
                    alt="70th Birthday Invitation"
                >



                <!-- HTML TEXT -->

                <div class="invitation-text">


                    <div class="invitation-title">

                        Սիրելի բարեկամ,

                    </div>


                    <div class="invitation-message">

                        Սիրով հրավիրում եմ Ձեզ մասնակցելու<br>

                        իմ 70ամյա հոբելյանի ուրախ երեկոյին։

                    </div>



                    <div class="date-row">


                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>
                                Երկուշաբթի
                            </div>

                            <div class="horizontal-line"></div>

                        </div>



                        <div class="date-center">


                            <div class="vertical-line"></div>


                            <div>

                                <div class="day-number">
                                    5
                                </div>

                                <div class="month">
                                    Հոկտեմբեր
                                </div>

                                <div class="year">
                                    2026
                                </div>

                            </div>


                            <div class="vertical-line"></div>


                        </div>



                        <div class="date-side">

                            <div class="horizontal-line"></div>

                            <div>
                                18։00
                            </div>

                            <div class="horizontal-line"></div>

                        </div>


                    </div>



                    <div class="venue">

                        «Մկրտչյանս Հոլլ» Սրահում

                    </div>



                    <div class="address">

                        Ք․ Մասիս, Էջմիածնի խճուղի 2/10

                    </div>



                    <div class="signature">

                        Սիրով Ձեր՝ Քիշո

                    </div>


                </div>


            </div>

        </div>


    </div>

</div>



<audio
    id="bgMusic"
    autoplay
    loop
    preload="auto"
>

    <source
        src="./music.mp3"
        type="audio/mpeg"
    >

</audio>



<button
    class="music-button"
    id="musicButton"
    aria-label="Play or pause music"
>

    ♪

</button>



<script>

const music =
    document.getElementById("bgMusic");

const musicButton =
    document.getElementById("musicButton");

music.volume = 0.7;



function tryAutoplay() {

    const attempt = music.play();


    if (attempt !== undefined) {

        attempt

            .then(function () {

                musicButton.innerHTML = "❚❚";

            })

            .catch(function () {

                musicButton.innerHTML = "♪";

            });

    }

}



document.addEventListener(
    "DOMContentLoaded",
    tryAutoplay
);


window.addEventListener(
    "load",
    tryAutoplay
);



musicButton.addEventListener(
    "click",
    function () {

        if (music.paused) {

            music.play();

            musicButton.innerHTML = "❚❚";

        }

        else {

            music.pause();

            musicButton.innerHTML = "♪";

        }

    }
);

</script>


</body>
</html>
